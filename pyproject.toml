[project]
name = "checkerboard-sampling"
version = "0.1.0"
authors = [
    { name = "Lolshh", email = "gasthoral@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "plotly>=6.9.0",
    "torch>=2.13.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["data", "frameworks", "models", "scripts", "utils", "viz"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
